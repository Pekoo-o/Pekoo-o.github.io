<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地洞</title>
<style>
:root{
  --paper:#ecebe5;--toner:#121212;--red:#f2321f;--strip:#f7f6f1;
  --heavy:"Source Han Sans SC Heavy","Noto Sans SC Black","Microsoft YaHei","PingFang SC","SimHei",sans-serif;
  --type:"Courier New",Courier,"FangSong","STFangsong",monospace;
  --read:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --ease:cubic-bezier(.45,.05,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#1e352c;color:var(--toner);font:15px/1.85 var(--type)}
a{color:inherit}
canvas{display:block;image-rendering:pixelated}
.x{filter:url(#xerox)}
.strip{display:inline-block;background:var(--strip);padding:6px 16px;box-shadow:0 0 0 1px rgba(0,0,0,.28)}
.scan{position:absolute;left:0;right:0;top:0;height:3px;background:#0b0b0b;box-shadow:0 0 22px 8px rgba(180,255,200,.55);opacity:0;z-index:10;pointer-events:none}
.in>.scan{animation:scan var(--dur,1.1s) var(--ease) forwards}
@keyframes scan{0%{top:0;opacity:1}94%{opacity:1}100%{top:100%;opacity:0}}

/* ───────── home: one sheet ───────── */
#home{position:fixed;inset:0;z-index:20;background:var(--paper);overflow:hidden auto;
  box-shadow:0 30px 70px rgba(0,0,0,.6);transition:transform .75s cubic-bezier(.6,0,.25,1)}
#home.away{transform:translateX(-112vw) rotate(-6deg);pointer-events:none}
.noanim{transition:none!important}
.s1{position:relative;height:100%;min-height:640px;overflow:hidden;--dur:1.5s}
.s1>.ink{position:absolute;inset:0;clip-path:inset(0 0 100% 0);transition:clip-path 1.5s var(--ease)}
.s1.in>.ink{clip-path:inset(0)}
.grain{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:.55;mix-blend-mode:multiply;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='table' tableValues='0 .35'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.s1::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:8;
  background:linear-gradient(90deg,transparent 21.6%,rgba(0,0,0,.05) 21.7%,transparent 22%,transparent 63.2%,rgba(0,0,0,.035) 63.3%,rgba(0,0,0,.06) 63.5%,transparent 63.7%)}
.s1::before{content:"";position:absolute;top:-20px;bottom:-20px;left:-10px;width:8vw;z-index:9;pointer-events:none;filter:url(#ragged);background:linear-gradient(90deg,#0b0b0b 0 22%,rgba(11,11,11,.55) 45%,transparent)}
.ab{position:absolute}
.hd{position:absolute;top:0;left:0;right:0;z-index:12;display:flex;justify-content:space-between;padding:16px 26px 16px 9vw;font-size:12px;letter-spacing:.14em;color:#fff;mix-blend-mode:difference}
.fig{right:7vw;top:10vh;width:42vw;height:56vh;transform:rotate(1.4deg)}
.fig canvas{width:100%;height:100%;outline:1px solid rgba(0,0,0,.3);outline-offset:-1px}
.fig .flash{position:absolute;left:0;right:0;top:0;height:3px;background:#0b0b0b;box-shadow:0 0 18px 6px rgba(180,255,200,.5);opacity:0}
.fig .flash.go{animation:scan .5s var(--ease)}
.s1 h1{left:-1.6vw;bottom:-10.5vw;font-family:var(--heavy);font-weight:900;font-size:37vw;line-height:1;letter-spacing:-.07em;z-index:4;user-select:none}
.q{left:9vw;top:15vh;z-index:5;max-width:44vw}
.q .strip{font-size:16px;transform:rotate(-1deg)}
.q .strip.big{font-size:22px;transform:rotate(.6deg);margin-top:12px}
.q small{display:block;font-size:12px;margin:8px 0 0 4vw;color:#555}
.idx{display:flex;flex-wrap:wrap;gap:22px 12px;margin-top:6.5vh;max-width:42vw}
.idx a{position:relative;display:block;background:var(--toner);color:var(--strip);font-family:var(--heavy);font-weight:900;font-size:clamp(19px,1.6vw,26px);line-height:1;letter-spacing:.08em;
  padding:9px 12px 9px 14px;text-decoration:none;transform:rotate(var(--r,0deg));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 0 rgba(0,0,0,.22);transition:transform .18s,background .15s}
.idx a:nth-child(1){--r:-1.6deg}.idx a:nth-child(2){--r:.9deg}.idx a:nth-child(3){--r:-.5deg}.idx a:nth-child(4){--r:1.4deg}.idx a:nth-child(5){--r:-1deg}.idx a:nth-child(6){--r:.7deg}
.idx b{position:absolute;left:1px;top:-16px;font:11px/1 var(--type);color:var(--red);letter-spacing:.05em}
.idx a:hover,.idx a:focus-visible{background:var(--red);transform:translateY(-4px) rotate(0);outline:none}
.vert{right:2vw;top:12vh;writing-mode:vertical-rl;font-size:13px;letter-spacing:.38em;z-index:5}
.staple{left:2.6vw;width:4px;height:30px;background:linear-gradient(90deg,#666,#d8d8d8,#777);z-index:10}

  linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px),
  linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),

  background:linear-gradient(rgba(24,43,36,.97) 55%,rgba(24,43,36,0))}
.bar a{text-decoration:none}
.back{flex:none;white-space:nowrap;background:var(--strip);color:var(--toner);padding:4px 14px;font-size:14px;letter-spacing:.05em;box-shadow:0 4px 10px rgba(0,0,0,.4);transition:transform .15s}
.back:hover{background:var(--toner);color:var(--strip);transform:translateX(-4px)}
.crumbs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumbs a{opacity:.65}.crumbs a:hover{opacity:1;text-decoration:underline}
.crumbs i{font-style:normal;opacity:.4;margin:0 .6em}
.bar nav{margin-left:auto;display:flex;gap:20px;flex:none}
.bar nav a{opacity:.7;padding-bottom:2px}
.bar nav a:hover{opacity:1}
.bar nav a.cur{opacity:1;border-bottom:2px solid var(--red)}
#host{padding:2vh 3.5vw 12vh}

.sheet{position:relative;margin:0 auto;max-width:1320px;transition:transform .22s,opacity .22s}
.sheet.out{transform:translateY(40px);opacity:0}
.sheet>.ink{position:relative;background:var(--strip);padding:8vh 6vw 9vh;

  clip-path:inset(-400px -400px 100% -400px);transition:clip-path var(--dur,1.1s) var(--ease)}
.sheet.in>.ink{clip-path:inset(-400px)}
/* after the scan pass: drop the toner filter so text renders crisp */
.sheet.done>.ink{clip-path:none}
.sheet.done .x{filter:none}
/* third level and deeper (e.g. an article): no scan, just appear */
.sheet.plain>.ink{clip-path:none;transition:none}
.sheet.plain>.scan{display:none}
.sheet.plain{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}}
.ttl{display:flex;align-items:flex-end;justify-content:space-between;gap:4vw;border-bottom:3px solid var(--toner);padding-bottom:14px;margin-bottom:3vh}
.ttl h2{font-family:var(--heavy);font-weight:900;font-size:clamp(56px,6vw,96px);line-height:.95;letter-spacing:-.04em}
.ttl p{max-width:420px;font-size:16px;color:#333;line-height:1.8;padding-bottom:4px}

/* words index */
.yr{font-family:"Arial Black",Arial,sans-serif;font-size:clamp(32px,3vw,46px);color:transparent;-webkit-text-stroke:1.2px var(--toner);line-height:1;margin:5vh 0 .5vh}
.posts a{display:grid;grid-template-columns:84px 1fr auto;gap:6px 28px;padding:22px 8px;border-bottom:1px dashed #b8b5ac;text-decoration:none;transition:background .15s}
.posts a:hover{background:rgba(0,0,0,.035)}
.posts .d{color:#555;font-size:15px;padding-top:6px}
.posts .t{font-family:var(--heavy);font-weight:900;font-size:clamp(26px,2.4vw,36px);line-height:1.3;justify-self:start;letter-spacing:-.01em}
.posts a:hover .t{background:linear-gradient(transparent 60%,rgba(242,50,31,.45) 60% 92%,transparent 92%)}
.posts .n{color:#555;font-size:14px;padding-top:8px;white-space:nowrap}
.posts .e{grid-column:2/4;font:17px/1.9 var(--read);color:#333;max-width:46em}

/* article */
.art{display:grid;grid-template-columns:250px minmax(0,1fr);gap:4.5vw}
.toc{position:sticky;top:90px;align-self:start;font-size:17px;padding-top:12px}
.toc p{font-size:14px;letter-spacing:.2em;color:#555;border-bottom:1px solid #555;padding-bottom:6px;margin-bottom:8px}
.toc a{display:block;text-decoration:none;padding:7px 0 7px 14px;border-left:3px solid transparent;color:#555;line-height:1.5;font-family:var(--read)}
.toc a:hover{color:var(--toner)}
.toc a.on{color:var(--toner);border-left-color:var(--red)}
.toc .sub{padding-left:28px;font-size:15.5px}
.body{max-width:860px}
.art .meta{font-size:14px;letter-spacing:.15em;color:#555}
.art h2{font-family:var(--heavy);font-weight:900;font-size:clamp(56px,6vw,96px);line-height:1;letter-spacing:-.04em;margin:12px 0 6vh;padding-bottom:18px;border-bottom:3px solid var(--toner)}
.art h3{font-family:var(--heavy);font-weight:900;font-size:clamp(24px,2vw,30px);line-height:1.4;margin:7vh 0 2.4vh;scroll-margin-top:90px}

/* prompts */
.pr{margin-top:5vh}
.pr-hd{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:2px solid var(--toner);padding-bottom:8px;margin-bottom:14px}
.pr h3{font-family:var(--heavy);font-weight:900;font-size:clamp(22px,1.8vw,28px)}
.pr .cp{font:14px var(--type);background:var(--toner);color:var(--strip);border:0;padding:5px 16px;cursor:pointer}
.pr .cp:hover{background:var(--red)}
.pr pre{white-space:pre-wrap;font:17px/1.95 var(--read);color:#1a1a1a;background:rgba(0,0,0,.035);padding:22px 26px;border-left:3px solid var(--red)}

/* empty sections */
.empty{position:relative;min-height:46vh;display:grid;place-items:center}
.stamp{font-family:var(--heavy);font-weight:900;font-size:clamp(56px,7vw,110px);letter-spacing:.2em;padding:.05em .1em .05em .3em;color:var(--red);border:.07em solid var(--red);transform:rotate(-8deg);opacity:.85;filter:url(#xerox2)}
.empty::before,.empty::after{content:"";position:absolute;left:0;right:0;height:1px;background:repeating-linear-gradient(90deg,#b8b5ac 0 6px,transparent 6px 12px)}
.empty::before{top:22%}.empty::after{bottom:22%}

@media(max-width:1000px){.art{grid-template-columns:1fr}.toc{display:none}}
@media(max-width:820px){
  #home .s1{min-height:max(100%,800px)}
  .s1 h1{font-size:52vw;bottom:-13vw}.fig{width:84vw;right:8vw;top:8vh;height:28vh}.q{top:calc(8vh + 28vh + 24px);max-width:84vw}
  .q .strip.big{font-size:17px}.idx{margin-top:4vh;max-width:90vw;gap:20px 8px}.idx a{font-size:16px;padding:8px 8px 8px 10px;letter-spacing:.04em}
  .vert,.staple,.s1::before{display:none}.hd{padding-left:26px}
  .bar{gap:12px;padding:12px 14px 18px}.bar nav{display:none}.hint{display:none}
  #host{padding:1vh 2.5vw 10vh}.sheet>.ink{padding:5vh 6vw 6vh}
  .ttl{flex-direction:column;align-items:flex-start}
  .posts a{grid-template-columns:1fr;padding:18px 2px}.posts .n{display:none}.posts .e{grid-column:1}
  .art .body>p,.art li{font-size:17.5px;line-height:2}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>

<!-- ───────── 文风提示词：每条一个 <script type="text/plain" id="prompt-<slug>" data-title="标题">，正文原样显示 ───────── -->
<script type="text/plain" id="prompt-ppt" data-title="导师汇报 PPT：字少、证据厚">
给导师汇报的技术 PPT，按"字少、证据厚"来做。每页都要同时做到两点：
一眼看出结论；看得出干了很多活，并且结果是严谨收敛的。

【页面骨架】
- 标题就是本页结论，一句话，带关键数字。
- 主体放 1–2 张大的证据图，占页面 55–65%，用原生工具截图
  （ADS DDS / ViVA / Virtuoso / Calibre RVE），不要重画成示意图。
- 图下面放 2–3 个结论块，每块三层：
  1) 粗体小标题，写这一块的发现（如"两个最优点不重合"）；
  2) 一到两行关键数字，最关键的数加粗（如"PAE 最大 31.2 % @ 16.3+j54.1 Ω"）；
  3) 一行灰色小字，写这个数怎么来的（推导式、对照值或扫描规模，
     如"= 20 + 余量 0.5 + 输入 0.72 + 级间 2×0.70"）。
- 每张图配一个来源小标签（如"ADS DDS"）加一句图注，图注只说图里画的是什么。

【证据图要显出工作量和严谨】
- 优先选能看出过程的图，而不只是终值：
  - 牵引用 Smith 圆图：等值线、全部仿真网格点、可行和不可行区域、最优点标记；
  - 扫描图要能看到扫描范围和点数（如"粗扫 2500 点"）；
  - 迭代和收敛：迭代历史、load↔source 往返收敛、粗扫到 0.1 dB 细扫的复核；
  - 互证：两种方法或两种口径对同一个量（HB 对 SP、分块对整机 EM、前仿对后仿）；
  - 取舍：几个候选或几种拓扑放在同一张图上比较，再标出选了哪个、为什么。
- 只有终值表或示意框图的页面，看起来像没干什么。表格和框图只能做辅助，
  每页至少要有一张真实的仿真或版图截图。
- 截图缩到页面显示尺寸后，坐标、刻度、图例、标注都必须读得清。读不清就拆页
  或裁剪，不要缩小。

【删掉的字】
- 不复述：图表里已经有的数，不在文字里再说一遍。
- 不写听众已知的口径（仿真设置、端口参考面、频点数、工具链）。条件只留
  会改变读数含义的那一行（如 TT / 25 ℃ / VDD 1.2 V），用小字放在表头或图旁边。
- 免责和限制说明（"只报告不判定""某部分未做"）放进讲稿或"未完项"页。
- 不放文件路径、脚本名、数据目录这类来源脚注。
- 推导式小字可以留。它证明数字有来历，和口径说明不是一回事。

【自检】
1. 遮住标题，只看图，能不能看出做了多少扫描、迭代或对比？看不出就换图或加图。
2. 每一行字问一句：删掉它，听众会误解结论，或者看不出这个数从哪来吗？都不会就删。
3. 前后几页的数字是同一口径，版本标签一致（如阶段 4 前仿 / NV7B 后仿）。
</script>

<!-- ───────── 文章：每篇一个 script，id 为 post-<slug>；空行分段，「一、」开头为小标题 ───────── -->
<script type="text/plain" id="post-lily" data-title="百合" data-date="2026.08.30">
一、细腻情感

眼神先于语言，动作先于告白，欲言又止的沉默。两个人明明靠得很近，却隔着一段说不出口的距离。

一是没有脚本。告白、交往、纪念日、见家长——异性恋叙事备好了一整套程序，情感一旦确认就能塞进制度里往前推。百合里这套程序缺席，重量无处安放，只好落回眼神、动作、沉默和距离本身。

二是女性视角独有的细腻，不必等事情发生，观察力本身就在生产情感。

二、少女崇拜

少女总是纯真的、美好的、尚未完成的。尚未进入成人世界，尚未被规定成某种形状，因此身上有一种轻盈的、短暂的、仿佛可以停留却终究无法停留的东西。少女不是年龄，是一种临界状态。

临界的珍贵正在于不能持续。就业，婚姻，成为某人的谁。百合把镜头停在这些发生之前，于是天然带一层还没有开始失去的光。

上两点共同构成了空气系

不能被命名、也不能被推进的关系，只剩下氛围、时间和空间可以承载。

空气系是有人文气息的：它处理存在，不提供内容。单位不是事件，是时刻。一台相机对着某个时空，记录人在无意义的时间里如何相互陪伴。

加上时间性，这份人文气息会更重。日常之所以是日常，正因为它有一个不被拍到的以后。

"日常系作品的时间，那就是作品的完结，并不代表他们的日常生活的结束，而仅仅是观众视线的结束，摄像机的结束，动画落下帷幕后，他们的生活依然继续。"

但摄像机会关掉。相遇的终点是分别，人生的终点是死亡。《轻音》里原本可以无限延续的下午，因为毕业突然有了终点；可以反复播放的歌，因为最后一次演奏而无法重来。《少终》把少女、战车、废土、末日堆在一起——越是巨大的毁灭，越显出两个人一起吃饭、一起走路、一起看雪的珍贵。

三、被稀释了的移情

缺席的男人还带走了代入的入口。

男性向叙事里，观众借主角的身体行动，承担他的选择，分享他的胜利。百合里这个位置被拆散：落在一个少女身上，落在两个人之间，落在一整个空间、一段天气、一种无法言明的氛围里。少女成了景观。观众退到一边，不打扰。

最舒适的地方也是最可疑的地方。

没有主角，也就不需要主线。日常系本是四格出身，单元可互换，顺序可打乱，少看一话不影响。叙事碎成一地时刻。

消费的单位随之下降：不是故事，是角色和时刻。故事只能卖一次，角色和时刻可以卖无数次——角色歌、周边、live、卡池，卖的不是接下来会发生什么，是"她们还在那里"。

剧情推进得越少，可供反复消费的容量越大。观众为不发生的事情付钱。

四、女性主义

把男人赶走，然后让一个女性取代其位置，上演一场王子与公主的大戏。我想，这不是一个满分的答案。

《少女革命》先把这个答案演了一遍。乌蒂娜穿上男装，赢下决斗，得到玫瑰新娘——姬宫安希服从任何一个胜者，包括她。她厌恶这件事，却只能接着打，一旦输掉安希就归别人。剑是这里唯一的求爱工具。

位置不换，性别换了也没用。公主还是被赢来的，斗技场还是需要一个被争夺的人。

更难堪的是，想当王子这个愿望本身是王子给的。童年救下她的王子后来成了凤晓生，戒指、决斗场、"世界尽头"都是他。她想成为的，正是操纵她的。

安希也不是公主，是魔女——"公主"不是属性，是判决。被凝视、被传递、沉默微笑，这一整套在别处是审美，在这里是剧情，于是旁观席成了共犯席。而凤学园里嫉妒、野心、暴力、背叛都发生在女性之间，男人不是被赶走的观众，是根本不必要的坐标。

结局里乌蒂娜没有赢。她被安希捅了一刀，消失，被全校遗忘，走出凤学园的是安希自己。不是公主被拯救，是公主离场；唯一有效的动作不是拔剑，是伸手，而那只手没能拉住人。

凤学园没有人毕业。永远的少女时代不是庇护，是不许长大的判决。斗技场存在的目的就是让人永远为"世界革命之力"而战——革命不是赢下这个世界，是走出去。

五、几种常见方向

这个题材内部分裂得厉害，不同方向连"少女"这个词都不是同一个意思。

空气系把关系留在不被命名的状态里。
关系性正面写确认与失衡。
芳文萌豚把少女做成一种可消费的稳定状态。
女性主义拆的是位置本身。
纯卖百合的不必绕弯。
</script>

<script src="dither.js"></script>
<script>
const SECTIONS=[['words','文字','window',2],['music','音乐','crowd',11],['photos','照片','sea',8],['work','项目','chip',3],['prompts','文风提示词','corridor',2],['contact','写信','house',4]];
const NAME=Object.fromEntries(SECTIONS.map(s=>[s[0],s[1]]));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* posts: parsed from <script type="text/plain" id="post-*"> */
const SUBHEADS=new Set(['上两点共同构成了空气系']);
const POSTS=[...document.querySelectorAll('script[id^="post-"]')].map(el=>{
  const blocks=el.textContent.trim().split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean),toc=[];let h=0;
  const html=blocks.map(b=>{
    if(/^[一二三四五六七八九十]+、/.test(b)){const id='s'+(++h);toc.push([id,b,0]);return`<h3 id="${id}">${esc(b)}</h3>`}
    if(SUBHEADS.has(b)){const id='s'+(++h);toc.push([id,b,1]);return`<h3 class="sub" id="${id}">${esc(b)}</h3>`}
    if(/^["“]/.test(b))return`<blockquote>${esc(b)}</blockquote>`;
    if(b.includes('\n'))return`<ul>${b.split('\n').map(l=>`<li>${esc(l.trim())}</li>`).join('')}</ul>`;
    return`<p>${esc(b)}</p>`}).join('');
  const text=blocks.join('');
  return{id:el.id.slice(5),t:el.dataset.title,d:el.dataset.date,html,toc,n:text.replace(/\s/g,'').length,e:blocks.find(b=>!/^[一二三四五六七八九十]+、/.test(b))};
}).sort((a,b)=>b.d.localeCompare(a.d));

const empty=(k,note)=>({cls:'',crumbs:[[NAME[k]]],html:`<div class="ttl"><h2 class="x">${NAME[k]}</h2><p>${note}</p></div><div class="empty"><span class="stamp">暂无</span></div>`});
const V={
 words(){return{cls:'',crumbs:[['文字']],html:`
  <div class="ttl"><h2 class="x">文字</h2><p>共 ${POSTS.length} 篇，按时间倒序。</p></div>
  ${[...new Set(POSTS.map(p=>p.d.slice(0,4)))].map(y=>`<p class="yr">${y}</p><div class="posts">${
    POSTS.filter(p=>p.d.startsWith(y)).map(p=>`<a href="#/words/${p.id}"><span class="d">${p.d.slice(5)}</span><span class="t">${esc(p.t)}</span><span class="n">${p.n} 字 · 约 ${Math.max(1,Math.round(p.n/400))} 分钟 →</span><span class="e">${esc(p.e)}</span></a>`).join('')}</div>`).join('')}`}},
 post(id){const i=POSTS.findIndex(p=>p.id===id);if(i<0)return null;const p=POSTS[i],nw=POSTS[i-1],od=POSTS[i+1];
  return{cls:'',crumbs:[['文字','#/words'],[p.t]],after:tocSpy,html:`<div class="art">
  <aside class="toc"><p>目录</p>${p.toc.map(([id,t,s])=>`<a href="#${id}" data-to="${id}" class="${s?'sub':''}">${esc(t)}</a>`).join('')}</aside>
  <div class="body"><p class="meta">${p.d} · ${p.n} 字 · 约 ${Math.max(1,Math.round(p.n/400))} 分钟</p><h2 class="x">${esc(p.t)}</h2>
  ${p.html}
  <div class="pn">${od?`<a href="#/words/${od.id}">← ${esc(od.t)}</a>`:'<span></span>'}${nw?`<a href="#/words/${nw.id}">${esc(nw.t)} →</a>`:'<a href="#/words">← 全部文字</a>'}</div></div></div>`}},
 music:()=>empty('music','自己录的歌和最近在听的。'),
 photos:()=>empty('photos','拍的照片，按卷整理。'),
 work:()=>empty('work','做过的项目和一些工具。'),
 prompts(){const P=[...document.querySelectorAll('script[id^="prompt-"]')];
  if(!P.length)return empty('prompts','写东西时给 AI 的文风要求，可以直接复制。');
  return{cls:'',crumbs:[['文风提示词']],after:copyBtns,html:`<div class="ttl"><h2 class="x">文风提示词</h2><p>写东西时给 AI 的文风要求，可以直接复制。</p></div>
  ${P.map(el=>`<section class="pr"><div class="pr-hd"><h3>${esc(el.dataset.title)}</h3><button class="cp">复制</button></div><pre>${esc(el.textContent.trim())}</pre></section>`).join('')}`}},
 contact:()=>empty('contact','邮箱和其他联系方式。'),
};

/* ───────── home ───────── */
const home=document.getElementById('home'),cover=document.getElementById('cover'),fig=document.getElementById('fig'),flash=document.querySelector('.fig .flash');
document.getElementById('idx').innerHTML=SECTIONS.map(([k,n],i)=>`<a href="#/${k}" data-i="${i}"><b>0${i+1}</b>${n}</a>`).join('');
document.getElementById('tabs').innerHTML=SECTIONS.map(([k,n])=>`<a href="#/${k}">${n}</a>`).join('');
let figKey='wires4';
function setFig(scene,seed){const k=scene+seed;if(k===figKey)return;figKey=k;Dither.render(fig,{scene,seed});flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go')}
document.querySelectorAll('#idx a').forEach(a=>{const s=SECTIONS[a.dataset.i];
  a.addEventListener('mouseenter',()=>setFig(s[2],s[3]));a.addEventListener('focus',()=>setFig(s[2],s[3]))});
document.getElementById('idx').addEventListener('mouseleave',()=>setFig('wires',4));

/* ───────── router ───────── */
const desk=document.getElementById('desk'),host=document.getElementById('host'),crumbs=document.getElementById('crumbs'),tabs=document.getElementById('tabs');
let token=0,atHome=true;
function route(){
  const raw=location.hash.replace(/^#\/?/,'');
  if(raw&&!raw.includes('/')&&document.getElementById(raw)&&!atHome)return; // in-page anchor (toc)
  const [a,b]=raw.split('/').filter(Boolean).map(decodeURIComponent);
  if(!a||!V[a]||a==='post'){showHome();return}
  const v=a==='words'&&b?V.post(b):V[a]();
  if(!v){location.replace('#/'+a);return}
  const my=++token,fromHome=atHome,deep=!!b;atHome=false;
  home.classList.add('away');
  crumbs.innerHTML=['<a href="#/">地洞</a>',...v.crumbs.map(([t,h])=>h?`<a href="${h}">${esc(t)}</a>`:`<span>${esc(t)}</span>`)].join('<i>/</i>');
  tabs.querySelectorAll('a').forEach(x=>x.classList.toggle('cur',x.getAttribute('href')==='#/'+a));
  document.title=v.crumbs.map(c=>c[0]).reverse().join(' · ')+' · 地洞';
  const old=host.firstElementChild;
  const mount=()=>{if(my!==token)return;
    host.innerHTML=`<article class="sheet ${v.cls}${deep?' plain in done':''}"><div class="ink">${v.html}</div><div class="scan"></div></article>`;
    desk.scrollTop=0;Dither.auto(host);v.after&&v.after(host);
    if(deep)return;const s=host.firstElementChild;requestAnimationFrame(()=>requestAnimationFrame(()=>{s.classList.add('in');setTimeout(()=>s.classList.add('done'),1150)}))};
  if(fromHome){if(old)old.remove();setTimeout(mount,home.classList.contains('noanim')?0:380)}
  else if(old){old.classList.add('out');setTimeout(mount,220)}else mount();
  unfreeze();
}
function showHome(){token++;atHome=true;home.classList.remove('away');document.title='地洞';
  if(!home.classList.contains('noanim'))setTimeout(()=>{if(atHome)host.innerHTML=''},800);unfreeze()}
function unfreeze(){requestAnimationFrame(()=>requestAnimationFrame(()=>home.classList.remove('noanim')))}
addEventListener('hashchange',route);
addEventListener('keydown',e=>{
  if(atHome){const n=+e.key;if(n>=1&&n<=SECTIONS.length)location.hash='#/'+SECTIONS[n-1][0];return}
  if(e.key==='Escape'){const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);location.hash=p.length>1?'#/'+p[0]:'#/'}
});

function copyBtns(root){root.querySelectorAll('.pr').forEach(sec=>{const b=sec.querySelector('.cp');b.addEventListener('click',async()=>{const t=sec.querySelector('pre').textContent;
  try{await navigator.clipboard.writeText(t)}catch(_){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}
  b.textContent='已复制';setTimeout(()=>b.textContent='复制',1500)})})}

/* toc: smooth scroll inside the desk + highlight current section */
function tocSpy(root){
  const links=[...root.querySelectorAll('.toc a')],heads=links.map(a=>root.querySelector('#'+a.dataset.to));
  links.forEach((a,i)=>a.addEventListener('click',e=>{e.preventDefault();desk.scrollTo({top:heads[i].getBoundingClientRect().top+desk.scrollTop-80,behavior:'smooth'})}));
  const upd=()=>{if(!root.isConnected){desk.removeEventListener('scroll',upd);return}
    let k=-1;heads.forEach((h,i)=>{if(h.getBoundingClientRect().top<200)k=i});links.forEach((a,i)=>a.classList.toggle('on',i===k))};
  desk.addEventListener('scroll',upd,{passive:true});upd();
}

Dither.render(fig);
requestAnimationFrame(()=>requestAnimationFrame(()=>cover.classList.add('in')));
route();
</script>
</body>
</html>
